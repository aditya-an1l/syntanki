<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbf9f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eeefe9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1a1a1a" />
  <!-- Spaced repetition rings (faint, behind card) -->
  <g opacity="0.10">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#f7a501" stroke-width="6" />
    <circle cx="256" cy="256" r="200" fill="none" stroke="#f7a501" stroke-width="4" stroke-dasharray="16,16" />
    <circle cx="256" cy="256" r="245" fill="none" stroke="#f7a501" stroke-width="3" stroke-dasharray="8,12" />
  </g>
  <!-- Flashcard -->
  <g filter="url(#shadow)">
    <rect x="104" y="104" width="304" height="304" rx="40" fill="url(#cardGrad)" stroke="#d9d4c6" stroke-width="2" />
    <!-- Card top accent bar -->
    <rect x="104" y="104" width="304" height="10" rx="5" fill="#f7a501" />
    <!-- Text lines on card -->
    <rect x="136" y="180" width="200" height="10" rx="4" fill="#c7c0b0" />
    <rect x="136" y="210" width="140" height="10" rx="4" fill="#c7c0b0" />
    <rect x="136" y="240" width="240" height="10" rx="4" fill="#c7c0b0" />
    <rect x="136" y="270" width="110" height="10" rx="4" fill="#c7c0b0" />
    <rect x="136" y="300" width="180" height="10" rx="4" fill="#c7c0b0" />
    <!-- Cloze blank -->
    <rect x="136" y="330" width="96" height="32" rx="8" fill="#f7a501" />
    <rect x="136" y="330" width="96" height="32" rx="8" fill="none" stroke="#1a1a1a" stroke-width="3" />
  </g>
  <!-- "S" monogram top-right -->
  <text x="410" y="130" font-family="IBM Plex Sans, sans-serif" font-size="48" font-weight="700" fill="#f7a501" text-anchor="end">S</text>
</svg>
